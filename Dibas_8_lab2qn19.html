<!DOCTYPE html>
<html>
<head>
    <title>Screen Information</title>
</head>
<body>

<h2>Screen Information</h2>

<button onclick="showScreenInfo()">Show Screen Info</button>

<p id="output"></p>

<script>
function showScreenInfo() {
    document.getElementById("output").innerHTML =
        "<b>Screen Width:</b> " + screen.width + " px<br>" +
        "<b>Screen Height:</b> " + screen.height + " px<br>" +
        "<b>Available Screen Width:</b> " + screen.availWidth + " px";
}
</script>

</body>
</html>
