<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        header{
            height:80px;
            border:1px solid black;
            background-color: aqua
        }
        .box1{
            display:flex;
            height:80px;
        }
        .r1,.ll{
            height: 80px;
            width: 50%;
            border:1px solid black;
        }
        .box2{
            display:flex;
            height:80px; 
        }
        .r2,.l2,.m2{
            height: 80px;
            width: 33%;
            border:1px solid black;
        }
        .r1{
            background-color: rgb(32, 226, 113);
        }
        .l1{
            background-color: rgb(226, 148, 32);
        }
        .r2{
            background-color: rgb(243, 203, 142);
        }
        .m2{
            background-color: rgb(233, 76, 149);
        }
        .l2{
            background-color: rgb(21, 168, 236);
        }
    </style>
</head>
<body>
    <header>Area 1</header>
    <div class="box1">
        <div class="r1">Area 2</div>
        <div class="l1">Area 3</div>
    </div>
    <div class="box2">
        <div class="r2">Area 4</div>
        <div class="m2">Area 5</div>
        <div class="l2">Area 6</div>
    </div>
</body>
</html>
