<!DOCTYPE html>
<html>
<head>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>

<button id="load">Load Data</button>
<div id="result"></div>

<script>
$("#load").click(function(){
  $.ajax({
    url: "data.txt",
    type: "GET",
    success: function(data){
      $("#result").html(data);
    },
    error: function(){
      $("#result").html("Error loading file");
    }
  });
});
</script>

</body>
</html>
