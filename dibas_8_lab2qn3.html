<!DOCTYPE html>
<html>
<head>
    <title>Larger and Smaller Number</title>
</head>
<body>

    <h2>Find Larger and Smaller Number</h2>

    <label>Enter First Integer:</label>
    <input type="number" id="num1"><br><br>

    <label>Enter Second Integer:</label>
    <input type="number" id="num2"><br><br>

    <button onclick="findNumbers()">Find</button>

    <h3>Result:</h3>
    <p id="result"></p>

    <script>
        function findNumbers() {
            let num1 = parseInt(document.getElementById("num1").value);
            let num2 = parseInt(document.getElementById("num2").value);

            if (num1 > num2) {
                document.getElementById("result").innerHTML =
                    "Larger Number = " + num1 + "<br>" +
                    "Smaller Number = " + num2;
            } else if (num2 > num1) {
                document.getElementById("result").innerHTML =
                    "Larger Number = " + num2 + "<br>" +
                    "Smaller Number = " + num1;
            } else {
                document.getElementById("result").innerHTML =
                    "Both numbers are equal.";
            }
        }
    </script>

</body>
</html>
