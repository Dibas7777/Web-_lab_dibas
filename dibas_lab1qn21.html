<!DOCTYPE html>
<html>
<head>
<style>

body{
  font-family: Arial;
  max-width: 800px;
  margin: auto;
  padding: 20px;
  font-size: 13px;
}

/* Header */
.header{
  display:flex;
  justify-content:space-between;
  margin-bottom:15px;
}

.logo{
  width:50px;
  height:50px;
  background:#ccc;
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:50%;
}

/* Invoice box */
table{
  width:100%;
  border-collapse:collapse;
}

td,th{
  border:1px solid #ddd;
  padding:6px;
  text-align:center;
}

th{
  background:#e8490a;
  color:white;
}

/* bottom */
.bottom{
  display:flex;
  justify-content:space-between;
  margin-top:15px;
}

.balance{
  background:#e8490a;
  color:white;
  padding:8px;
  font-weight:bold;
}

</style>
</head>

<body>

<!-- Header -->
<div class="header">
  <div class="logo">LOGO</div>
  <h2>INVOICE</h2>
</div>

<!-- Info -->
<p><b>Company Name</b> | Address | Contact</p>

<!-- Table -->
<table>
  <tr>
    <th>Description</th>
    <th>Qty</th>
    <th>Price</th>
    <th>Total</th>
  </tr>

  <tr>
    <td>Item 1</td>
    <td>1</td>
    <td>100</td>
    <td>100</td>
  </tr>

  <tr>
    <td>Item 2</td>
    <td>2</td>
    <td>200</td>
    <td>400</td>
  </tr>
</table>

<!-- Bottom -->
<div class="bottom">
  <div>Payment Details</div>
  <div class="balance">Balance Due: 500</div>
</div>

</body>
</html>
