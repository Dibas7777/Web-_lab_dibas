<!DOCTYPE html>
<html>
<head>
    <title>Iframe and Image Example</title>
</head>
<body>

    <h2>Example of Image Tag</h2>
    <img src="https://via.placeholder.com/300" alt="Sample Image" width="300" height="200">

    <h2>Example of Iframe Tag</h2>
    <iframe 
        src="https://www.wikipedia.org"
        width="600"
        height="400">
    </iframe>

</body>
</html>
