<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration / Login Form</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    background: url("../image/nature.jpg") no-repeat center center/cover;
}
.container{
    width:80%;
    margin:20px auto;
    background:rgba(0,0,0,0.5);
    padding:20px;
}
h1{
    text-align:center;
    color:white;
    margin-bottom:20px;
}
.main{
    display:flex;
    justify-content:space-between;
}
.left,.right{
    width:48%;
    background:rgba(0,0,0,0.55);
    padding:20px;
    color:white;
}
h2{
    margin-bottom:20px;
}
input[type=text],
input[type=email],
input[type=password]{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    background:#ddd;
}
.small{
    font-size:12px;
    color:#ddd;
    margin-bottom:10px;
}
.gender{
    margin:15px 0;
}
.gender label{
    margin-right:25px;
}
.terms{
    margin:20px 0;
}
.btn{
    width:100%;
    padding:12px;
    border:none;
    background:#d4b04c;
    color:white;
    font-size:18px;
}
.btn:hover{
    background:#c59a20;
}
.remember{
    margin-top:15px;
    margin-bottom:120px;
}
.footer{
    text-align:center;
    color:white;
    margin-top:20px;
    font-size:14px;
}
</style>
</head>
<body>
<div class="container">
    <h1>REGISTRATION / LOGIN FORM</h1>
    <div class="main">
        <div class="left">
            <h2>Register Form :</h2>
            <input type="text" placeholder="Username">
            <input type="email" placeholder="Email">
            <div class="small">Please enter a valid email address.</div>
            <input type="password" placeholder="Password">
            <div class="small">Minimum of 8 characters.</div>
            <input type="password" placeholder="Confirm password">
            <div class="gender">
                <label><input type="radio" name="g"> Female</label>
                <label><input type="radio" name="g"> Male</label>
            </div>
            <div class="terms">
                <label>
                    <input type="checkbox">
                    I have read and accept terms of use.
                </label>
            </div>
            <button class="btn">SUBMIT</button>
        </div>
        <div class="right">
            <h2>Login form :</h2>
            <input type="email" placeholder="Enter Your Email">
            <input type="password" placeholder="Password">
            <div class="remember">
                <label>
                    <input type="checkbox">
                    Remember me
                </label>
            </div>
            <button class="btn">LOGIN</button>
        </div>
    </div>
    <div class="footer">
        © 2025 Registration / Login Form . All Rights Reserved.
    </div>
</div>
</body>
</html>
