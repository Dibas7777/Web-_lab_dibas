<!DOCTYPE html>
<html>
<head>
  <title>Counter Program</title>
  <style>
    body {
      text-align: center;
      margin-top: 100px;
      font-family: Arial;
    }
    #count {
      display: inline-block;
      padding: 10px 20px;
      font-size: 20px;
      color: black;
      background-color: pink;
      border-radius: 5px;
      margin-bottom: 20px;
      min-width: 40px;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      font-size: 18px;
      cursor: pointer;
      background-color: green;
      color: white;
      border: none;
      border-radius: 5px;
    }
    button:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>
<h2>Counter Program</h2>
<div id="count">0</div>
<br>
<button onclick="decrease()">-</button>
<button onclick="reset()">Reset</button>
<button onclick="increase()">+</button>
<script>
  let counter = 0;
  function updateDisplay() {
    document.getElementById("count").innerText = counter;
  }
  function increase() {
    counter++;
    updateDisplay();
  }
  function decrease() {
    counter--;
    updateDisplay();
  }
  function reset() {
    counter = 0;
    updateDisplay();
  }
</script>
</body>
</html>
