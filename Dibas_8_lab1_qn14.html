<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            margin:0;
            justify-content: center;
        }
        header{
            height:60px;
            background-color: aliceblue;
            margin: 0%; 
            justify-content: center;
        }
        nav{
            height:40px;
            background-color: antiquewhite;
        }
        .box{
          height:120px;
          margin: 0%;  
        }
        .right{
           height:120px; 
           background-color:rgb(124, 223, 138); 
           width:30%;
           float:left;
        }
        main{
            height:120px; 
            background-color:rgb(235, 101, 179); 
            width:40%;
           float:left;
        }
        .left{
            height:120px; 
            background-color:rgb(240, 252, 83); 
            width:30%;
           float:right;
        }
        footer{
            height:30px; 
            background-color:rgb(245, 153, 91); 

        }
    </style>
</head>
<body>
    <header>
        <p>Header</p>
    </header>
    <nav>
        <p>Navigation</p>
    </nav>
    <div class="box">
        <aside class="right"><p>right</p></aside>
        <main>
            <p>middle</p>    
        </main>
        <aside class="left"><p>left</p></aside>
    </div>
    <footer><p>footer</p></footer>
</body>
</html>
