<!DOCTYPE html>
<html>
<head>
<style>
.box {
  position: relative;
  display: inline-block;
}
.box img {
  width: 200px;
  display: block;
}
.box .text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: white;
  background: black;
  padding: 5px;
  display: none;
}
.box:hover .text {
  display: block;
}
</style>
</head>

<body>

<div class="box">
  <img src="../image/nature.jpg">
  <div class="text">Hover Text</div>
</div>

</body>
</html>
